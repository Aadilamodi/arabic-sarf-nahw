/* =========================
   SEARCH FUNCTION
========================= */

function searchWord(){

let word =
document.getElementById("searchBox")
.value
.trim();

let result =
document.getElementById("result");


/* اعراب کے ساتھ تلاش */

let found = words[word];


/* اعراب کے بغیر بھی کچھ عام الفاظ تلاش ہوں */

if(!found){

let cleanWord = word
.replace(/[\u064B-\u065F\u0670]/g,"");

for(let key in words){

let cleanKey = key
.replace(/[\u064B-\u065F\u0670]/g,"");

let cleanLafz = words[key].لفظ
?
words[key].لفظ.replace(/[\u064B-\u065F\u0670]/g,"")
:"";

if(
cleanKey === cleanWord ||
cleanLafz === cleanWord
){
found = words[key];
break;
}

}

}


/* RESULT */

if(found){

let html = "";

if(found.قسم){
html += `
<div class="card">
<div class="label">قسم</div>
<div class="arabic">${found.قسم}</div>

`;
}
