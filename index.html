<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arabic Sarf & Nahw</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f5f7;
  margin:0;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 15px #ccc;
}

h1{
  text-align:center;
  color:#176b4d;
}

.search{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:14px;
  font-size:20px;
  border:1px solid #bbb;
  border-radius:10px;
}

button{
  padding:12px 20px;
  background:#176b4d;
  color:white;
  border:0;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}

.card{
  background:#f7faf8;
  border-right:5px solid #176b4d;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.label{
  font-weight:bold;
  color:#444;
}

.arabic{
  font-size:28px;
  font-weight:bold;
  color:#176b4d;
}

.notfound{
  text-align:center;
  color:red;
  font-size:20px;
  padding:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 Arabic Sarf & Nahw</h1>

<div class="search">

<input id="searchBox" type="text" placeholder="عربی لفظ لکھیں">

<button onclick="searchWord()">تلاش</button>

</div>

<div id="result"></div>

</div>


<script>

const words = {

"نصر":{
فعل:"نَصَرَ",
معنی:"مدد کرنا / મદદ કરવી",
باب:"نَصَرَ يَنْصُرُ",
مصدر:"نَصْرٌ",
امر:"اُنْصُرْ",
نہی:"لَا تَنْصُرْ",
فاعل:"نَاصِرٌ",
مفعول:"مَنْصُورٌ"
},

"ضرب":{
فعل:"ضَرَبَ",
معنی:"مارنا / મારવું",
باب:"ضَرَبَ يَضْرِبُ",
مصدر:"ضَرْبٌ",
امر:"اِضْرِبْ",
نہی:"لَا تَضْرِبْ",
فاعل:"ضَارِبٌ",
مفعول:"مَضْرُوبٌ"
},

"سمع":{
فعل:"سَمِعَ",
معنی:"سننا / સાંભળવું",
باب:"سَمِعَ يَسْمَعُ",
مصدر:"سَمَاعٌ",
امر:"اِسْمَعْ",
نہی:"لَا تَسْمَعْ",
فاعل:"سَامِعٌ",
مفعول:"مَسْمُوعٌ"
},

"فتح":{
فعل:"فَتَحَ",
معنی:"کھولنا / ખોલવું",
باب:"فَتَحَ يَفْتَحُ",
مصدر:"فَتْحٌ",
امر:"اِفْتَحْ",
نہی:"لَا تَفْتَحْ",
فاعل:"فَاتِحٌ",
مفعول:"مَفْتُوحٌ"
},

"كرم":{
فعل:"كَرُمَ",
معنی:"معزز ہونا / ઉદાર થવું",
باب:"كَرُمَ يَكْرُمُ",
مصدر:"كَرَمٌ",
امر:"اُكْرُمْ",
نہی:"لَا تَكْرُمْ",
فاعل:"كَرِيمٌ",
مفعول:"—"
},

"حسب":{
فعل:"حَسِبَ",
معنی:"گمان کرنا / માનવું",
باب:"حَسِبَ يَحْسَبُ",
مصدر:"حِسْبَانٌ",
امر:"اِحْسَبْ",
نہی:"لَا تَحْسَبْ",
فاعل:"حَاسِبٌ",
مفعول:"مَحْسُوبٌ"
}

};


function searchWord(){

let word=document.getElementById("searchBox").value.trim();

let result=document.getElementById("result");

if(words[word]){

let w=words[word];

result.innerHTML=`

<div class="card">
<div class="label">فعل</div>
<div class="arabic">${w.فعل}</div>
</div>

<div class="card">
<div class="label">معنی</div>
${w.معنی}
</div>

<div class="card">
<div class="label">باب</div>
${w.باب}
</div>

<div class="card">
<div class="label">مصدر</div>
${w.مصدر}
</div>

<div class="card">
<div class="label">امر</div>
${w.امر}
</div>

<div class="card">
<div class="label">نہی</div>
${w.نہی}
</div>

<div class="card">
<div class="label">فاعل</div>
${w.فاعل}
</div>

<div class="card">
<div class="label">مفعول</div>
${w.مفعول}
</div>

`;

}else{

result.innerHTML=`

<div class="notfound">
معلومات نہیں ملی
<br>
لفظ ابھی database میں موجود نہیں ہے۔
</div>

`;

}

}

</script>

</body>
</html>
